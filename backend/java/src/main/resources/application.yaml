spring:
  application:
    name: project-columbo

  datasource:
    url: jdbc:postgresql://localhost:5432/columbo
    username: emmett
    password: secret
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      max-lifetime: 1800000        # 30 minutes
      idle-timeout: 600000         # 10 minutes
      connection-timeout: 30000    # 30 seconds
      auto-commit: true
      leak-detection-threshold: 60000  # 1 minute

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  docker:
    compose:
      enabled: false

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.jdbc: INFO

app:
  coingecko:
    api-key: ${COINGECKO_API_KEY:}
    base-url: "https://api.coingecko.com/api/v3"
  binance:
    base-url: "https://api.binance.com"
  market-pipeline:
    cron: "0 5 0 * * *" # Run at 00:05 UTC every day
  ingestion:
    backfill-start: "2024-01-01T00:00:00Z"
  async:
    indicator-computation:
      cor-pool-size: 8
      max-pool-size: 16
      queue-capacity: 100

