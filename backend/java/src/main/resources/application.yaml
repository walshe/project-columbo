spring:
  application:
    name: project-columbo

  datasource:
    url: jdbc:postgresql://localhost:5432/columbo
    username: emmett
    password: secret
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      max-lifetime: 1800000        # 30 minutes
      idle-timeout: 600000         # 10 minutes
      connection-timeout: 30000    # 30 seconds
      auto-commit: true
      leak-detection-threshold: 60000  # 1 minute

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  docker:
    compose:
      enabled: false

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.jdbc: INFO

app:
  coingecko:
    api-key: ${COINGECKO_API_KEY:}
    base-url: "https://api.coingecko.com/api/v3"
  binance:
    base-url: "https://api.binance.com"
  market-pipeline:
    cron: "0 5 0 * * *" # Run at 00:05 UTC every day
  ingestion:
    # ~1 year (~52 weekly candles) — comfortably clears W1 SuperTrend's ~20-week ATR warm-up,
    # and keeps a fresh single-pass backfill under Binance's 500-candle klines default so it is
    # not silently truncated. BackfillStartValidator fails startup if this is too recent.
    # If Elder Impulse System is reinstated, move this back to 2023-01-01 — EMA-13/MACD on W1
    # needs ~100 weekly candles (~2 years) for Wilder's smoothing to stabilise (and raise
    # MIN_WEEKLY_CANDLES_REQUIRED in BackfillStartValidator to match).
    backfill-start: "2025-07-01T00:00:00Z"
  async:
    indicator-computation:
      core-pool-size: 8
      max-pool-size: 16
      queue-capacity: 100

