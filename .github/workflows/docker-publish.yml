name: Build and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "backend/java25-no-spring/src/**"
      - "backend/java25-no-spring/pom.xml"
      - "backend/java25-no-spring/Dockerfile"
      - ".github/workflows/docker-publish.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Matches the image compose.prod.yaml already expects (ghcr.io/<owner>/project-columbo-java25)
          images: ghcr.io/${{ github.repository_owner }}/project-columbo-java25
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend/java25-no-spring
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
